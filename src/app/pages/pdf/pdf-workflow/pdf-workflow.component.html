<app-upload (fileUploaded)="onFilesUploaded($event)"></app-upload>

<div class="files-container" *ngIf="uploadedFiles.length > 0">

  <h2>Archivos subidos</h2>

  <div *ngFor="let file of uploadedFiles" class="file-block">

    <app-editor [file]="file"></app-editor>

    <app-convertidor [file]="file"></app-convertidor>

  </div>
