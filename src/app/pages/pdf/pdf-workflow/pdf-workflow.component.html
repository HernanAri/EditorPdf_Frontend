<app-upload (fileUploaded)="onFilesUploaded($event)"></app-upload>

<div *ngIf="uploadedFiles.length > 0">

  <!-- SOLO UN EDITOR -->
  <app-editor
      [allFiles]="uploadedFiles"
      [file]="uploadedFiles[0]">
  </app-editor>

  <!-- SOLO UN CONVERTIDOR -->
  <app-convertidor
      [allFiles]="uploadedFiles"
      [file]="uploadedFiles[0]">
  </app-convertidor>

</div>
