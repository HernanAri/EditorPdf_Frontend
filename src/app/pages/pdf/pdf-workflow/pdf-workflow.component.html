<app-upload (fileUploaded)="onFilesUploaded($event)"
(fileSelected)="onFileSelected($event)"
[file]="uploadedFiles"></app-upload>

<div *ngIf="uploadedFiles.length > 0">

  <app-editor
      *ngIf="activeTool === 'editor'"
      [allFiles]="uploadedFiles"
      [file]="uploadedFiles[0]">
  </app-editor>

  <app-convertidor
      *ngIf="activeTool === 'convertidor'"
      [allFiles]="uploadedFiles"
      [file]="uploadedFiles[0]">
  </app-convertidor>

</div>
