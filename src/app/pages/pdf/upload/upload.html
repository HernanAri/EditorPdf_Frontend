<div class="upload-wrapper">
  <div
    class="upload-zone"
    [ngClass]="{ 'dragging': isDragging }"
    (dragover)="handleDragOver($event)"
    (dragleave)="handleDragLeave($event)"
    (drop)="handleDrop($event)"
  >
    <!-- Ícono -->
    <svg 
        class="upload-icon"
        xmlns="http://www.w3.org/2000/svg" 
        fill="none" 
        viewBox="0 0 24 24" 
        stroke-width="1.5" 
        stroke="currentColor" >
            <path 
            stroke-linecap="round" 
            stroke-linejoin="round" 
            d="M19.5 14.25v-2.625a3.375 3.375 0 0 0-3.375-3.375h-1.5A1.125 1.125 0 0 1 13.5 7.125v-1.5a3.375 3.375 0 0 0-3.375-3.375H8.25m3.75 9v6m3-3H9m1.5-12H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 0 0-9-9Z" />
    </svg>

    <!-- Título -->
    <h2 class="upload-title">Sube tu archivo PDF</h2>
    <p class="upload-subtitle">Arrastra y suelta o haz clic para seleccionar</p>

    <!-- Botón de carga -->
    <label class="upload-button">
      Seleccionar archivo
      <input type="file" accept=".pdf" (change)="onFilesSelected($event)" />
    </label>

    <!-- Mensajes de error -->
    <div *ngIf="errorMessages.length > 0" class="error-message">
      <p *ngFor="let error of errorMessages">{{ error }}</p>
    </div>

    <!-- Archivos seleccionados -->
    <div *ngIf="filePreviews.length > 0" class="preview-list">
      <div *ngFor="let preview of filePreviews; let i = index" class="preview-item">
        <p class="file-name">{{ selectedFiles[i].name }}</p>
        <iframe [src]="preview" width="100%" height="400px"></iframe>
        <button (click)="removeFile(selectedFiles[i])" class="remove-button">Eliminar</button>
      </div>
      <button (click)="uploadFiles()" class="upload-confirm">Subir archivos</button>
    </div>
  </div>
</div>
